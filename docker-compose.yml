# Local development stack for the backend.
#   docker compose up --build -d --wait
# The API image is built once from apps/api/Dockerfile; migrate applies roles and migrations
# before api/internal/worker start. Rebuild after code changes.
x-app-environment: &app-environment
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  PUBLIC_HOST: 0.0.0.0
  PUBLIC_PORT: 3000
  INTERNAL_HOST: 0.0.0.0
  INTERNAL_PORT: 3100
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
  SWAGGER_ENABLED: 'true'
  DATABASE_URL: ${DATABASE_URL:-postgres://geniebox_app:app_dev_password@postgres:5432/geniebox}
  DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-postgres://geniebox_system:system_dev_password@postgres:5432/geniebox}
  DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:-postgres://geniebox_owner:owner_dev_password@postgres:5432/geniebox}
  DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgres://postgres:postgres@postgres:5432/postgres}
  REDIS_STATE_URL: ${REDIS_STATE_URL:-redis://redis-state:6379/0}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis-cache:6379/0}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3001}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  MAIL_TRANSPORT: smtp
  SMTP_URL: smtp://mail:1025
  MAIL_FROM: '${MAIL_FROM:-Geniebox <no-reply@geniebox.local>}'
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@geniebox.local}
  SECRETS_PUBLIC_KEY_FILE: .secrets/kek.pub.pem
  SECRETS_PRIVATE_KEY_FILES: .secrets/kek.key.pem
  CONNECTIONS_ALLOW_PRIVATE_HOSTS: 'true'
  LLM_PROVIDER: fake
  # Uploaded knowledge sources; shared by api and worker, outside the web root.
  KNOWLEDGE_BLOB_DIR: /app/data/knowledge
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}

x-app: &app
  image: geniebox-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: *app-environment
  volumes:
    - ./apps/api/.secrets:/app/.secrets:ro
    - knowledge-data:/app/data/knowledge
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis-state:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  postgres:
    # pgvector builds on the same 17 image; the extension is created by a migration.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  redis-state:
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ./infra/redis/state.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-state:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - ./infra/redis/cache.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  migrate:
    image: geniebox-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-environment
    command: ['sh', '-ec', 'node dist/database/cli.js bootstrap && node dist/database/cli.js migrate']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'dist/main.js']
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  internal:
    <<: *app
    command: ['node', 'dist/main.internal.js']
    ports:
      - '127.0.0.1:3100:3100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health/details').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ['node', 'dist/main.worker.js']

volumes:
  postgres-data:
  redis-state:
  knowledge-data:
