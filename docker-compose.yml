services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geniebox}
      POSTGRES_USER: ${POSTGRES_USER:-geniebox_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'

  migrate:
    image: geniebox-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['sh', '-ec', 'node dist/database/cli.js bootstrap && node dist/database/cli.js migrate']
    environment:
      DB_MIGRATION_URL: ${DB_MIGRATION_URL}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: geniebox-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: geniebox-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  proxy:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres-data:
