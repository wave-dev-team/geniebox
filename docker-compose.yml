services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geniebox}
      POSTGRES_USER: ${POSTGRES_USER:-geniebox_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15

  mail:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAIL_WEB_PORT:-8025}:8025'

  migrate:
    image: geniebox-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['sh', '-ec', 'node dist/database/cli.js bootstrap && node dist/database/cli.js migrate']
    environment:
      DB_MIGRATION_URL: ${DB_MIGRATION_URL}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: geniebox-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &app-environment
      API_HOST: 0.0.0.0
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_IDENTITY_SECRET: ${AUTH_IDENTITY_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SMTP_URL: ${SMTP_URL:-smtp://mail:1025}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-no-reply@geniebox.test}
      CONNECTIONS_ENCRYPTION_KEY: ${CONNECTIONS_ENCRYPTION_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_INCLUDE_WORKSPACE_REPORTS: ${LLM_INCLUDE_WORKSPACE_REPORTS:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-768}
      LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-100}
      LLM_CALLS_PER_MINUTE: ${LLM_CALLS_PER_MINUTE:-30}
      LLM_INPUT_USD_PER_MTOK: ${LLM_INPUT_USD_PER_MTOK:-0}
      LLM_OUTPUT_USD_PER_MTOK: ${LLM_OUTPUT_USD_PER_MTOK:-0}
      AUTH_COOKIE_SECURE: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    image: geniebox-api:local
    restart: unless-stopped
    command: ['node', 'dist/main.worker.js']
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  internal:
    image: geniebox-api:local
    restart: unless-stopped
    command: ['node', 'dist/main.internal.js']
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8001/internal/health/details').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    image: geniebox-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  proxy:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
