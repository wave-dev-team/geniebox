x-database: &database
  DATABASE_URL: ${RUNTIME_DATABASE_URL:?required}
  DATABASE_SYSTEM_URL: ${RUNTIME_DATABASE_SYSTEM_URL:?required}

x-app-environment: &app-environment
  <<: *database
  NODE_ENV: production
  PUBLIC_HOST: 0.0.0.0
  PUBLIC_PORT: 8000
  INTERNAL_HOST: 127.0.0.1
  INTERNAL_PORT: 8001
  TRUST_PROXY: '${TRUST_PROXY:-loopback,uniquelocal}'
  CORS_ORIGINS: https://app.geniebox.ru
  REDIS_STATE_URL: redis://redis-state:6379
  REDIS_CACHE_URL: redis://redis-cache:6379
  APP_PUBLIC_URL: https://app.geniebox.ru
  JWT_ACCESS_SECRET: ${JWT_SECRET:?required}
  MAIL_TRANSPORT: smtp
  SMTP_URL: ${SMTP_URL:?required}
  MAIL_FROM: ${AUTH_MAIL_FROM:?required}
  SECRETS_PUBLIC_KEY_FILE: /run/geniebox/kek.pub.pem
  LLM_PROVIDER: openai
  OPENAI_API_KEY: ${OPENAI_API_KEY:?set on the deployment server}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
  LLM_MODEL_FAST: ${LLM_MODEL_FAST:-gpt-4.1-mini}
  AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-15}
  KNOWLEDGE_BLOB_DIR: /var/lib/geniebox/knowledge
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}

x-app: &app
  image: ghcr.io/wave-dev-team/geniebox-api:${RELEASE_SHA:?required}
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - ${RUNTIME_SECRETS_DIR:?required}/kek.pub.pem:/run/geniebox/kek.pub.pem:ro
    - knowledge-data:/var/lib/geniebox/knowledge
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis-state:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  # Use a separate cluster and volumes so the previous release remains recoverable.
  runtime-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - runtime-postgres-data:/var/lib/postgresql/data

  redis-state:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - runtime-redis-data:/data

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    image: ghcr.io/wave-dev-team/geniebox-api:${RELEASE_SHA:?required}
    command: ['sh', '-ec', 'node dist/database/cli.js bootstrap && node dist/database/cli.js migrate']
    environment:
      <<: *database
      DATABASE_ADMIN_URL: ${RUNTIME_DATABASE_ADMIN_URL:?required}
      DATABASE_OWNER_URL: ${RUNTIME_DATABASE_OWNER_URL:?required}
    depends_on:
      runtime-db:
        condition: service_healthy

  api:
    <<: *app
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:8000:8000'

  worker:
    <<: *app
    command: ['node', 'dist/main.worker.js']
    environment:
      <<: *app-environment
      SECRETS_PRIVATE_KEY_FILES: /run/geniebox/kek.key.pem
    volumes:
      - ${RUNTIME_SECRETS_DIR:?required}/kek.pub.pem:/run/geniebox/kek.pub.pem:ro
      - ${RUNTIME_SECRETS_DIR:?required}/kek.key.pem:/run/geniebox/kek.key.pem:ro
      - knowledge-data:/var/lib/geniebox/knowledge

  internal:
    <<: *app
    command: ['node', 'dist/main.internal.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8001/health/details').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: ghcr.io/wave-dev-team/geniebox-web:${RELEASE_SHA:?required}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  runtime-postgres-data:
  runtime-redis-data:
  knowledge-data:
