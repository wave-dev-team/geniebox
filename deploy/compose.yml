services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geniebox}
      POSTGRES_USER: ${POSTGRES_USER:-geniebox_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    image: ghcr.io/wave-dev-team/geniebox-api:${RELEASE_SHA:?required}
    command: ['sh', '-ec', 'node dist/database/cli.js bootstrap && node dist/database/cli.js migrate']
    environment:
      DB_MIGRATION_URL: ${DB_MIGRATION_URL:?required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?required}
    depends_on:
      db:
        condition: service_healthy

  api:
    restart: unless-stopped
    image: ghcr.io/wave-dev-team/geniebox-api:${RELEASE_SHA:?required}
    environment: &app-environment
      API_HOST: 0.0.0.0
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      AUTH_IDENTITY_SECRET: ${AUTH_IDENTITY_SECRET:?required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SMTP_URL: ${SMTP_URL:?required}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:?required}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      CONNECTIONS_ENCRYPTION_KEY: ${CONNECTIONS_ENCRYPTION_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_INCLUDE_WORKSPACE_REPORTS: ${LLM_INCLUDE_WORKSPACE_REPORTS:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-768}
      LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-100}
      LLM_CALLS_PER_MINUTE: ${LLM_CALLS_PER_MINUTE:-30}
      LLM_INPUT_USD_PER_MTOK: ${LLM_INPUT_USD_PER_MTOK:-0}
      LLM_OUTPUT_USD_PER_MTOK: ${LLM_OUTPUT_USD_PER_MTOK:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:8000:8000'

  worker:
    image: ghcr.io/wave-dev-team/geniebox-api:${RELEASE_SHA:?required}
    restart: unless-stopped
    command: ['node', 'dist/main.worker.js']
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  internal:
    image: ghcr.io/wave-dev-team/geniebox-api:${RELEASE_SHA:?required}
    restart: unless-stopped
    command: ['node', 'dist/main.internal.js']
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8001/internal/health/details').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    image: ghcr.io/wave-dev-team/geniebox-web:${RELEASE_SHA:?required}
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  postgres-data:
  redis-data:
